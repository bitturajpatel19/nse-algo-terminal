services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nse-algo-terminal-api:local
    container_name: nse-algo-terminal-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      # Bind locally; put a TLS reverse proxy in front before public use.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
